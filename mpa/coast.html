<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coastal Cliffs — Cross-document View Transitions</title>
  <link rel="stylesheet" href="/styles/shared.css">
  <link rel="stylesheet" href="/mpa/styles.css">
</head>
<body>
  <div class="demo-shell">
    <nav class="demo-nav">
      <a href="/">← All demos</a>
      <h1>Cross-document transitions</h1>
      <span class="tag">MPA</span>
    </nav>

    <div class="demo-content">
      <article class="detail-page">
        <div class="detail-hero">
          <img
            class="hero-image"
            style="view-transition-name: hero-image"
            src=""
            alt=""
            data-color="#1e3a5f"
            data-accent="#60a5fa"
          />
        </div>
        <div class="detail-info">
          <h2 class="hero-title" style="view-transition-name: hero-title">Coastal Cliffs</h2>
          <p class="meta">Big Sur, California</p>
          <p class="description">
            Fog rolls in over jagged headlands where the Pacific meets ancient rock.
            Seabirds wheel above tide pools glittering in the late afternoon light.
          </p>
          <a class="back-link" href="/mpa/">← Back to destinations</a>
        </div>
      </article>
    </div>
  </div>

  <script src="/mpa/shared.js"></script>
  <script>
    const img = document.querySelector(".hero-image");
    img.src = makePlaceholder(img.dataset.color, img.dataset.accent);
  </script>
</body>
</html>
